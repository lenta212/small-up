- type: entity
  parent: MobHuman
  id: LuaMRescueAgent
  name: LuaM rescue agent
  suffix: LuaM, Player-like NPC
  description: Человекоподобный спасатель, которым управляет LuaM-сервер или администратор.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes:
    - LuaMRescueAgentGear
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: InputMover
  - type: MobMover
  - type: DoAfter
    raiseEndedEvent: true
  - type: LuaMRescuePersonnel
  - type: LuaMRescueAgent
  - type: LuaMRescueBehaviorAdapter
  - type: LuaMBehaviorAgent
    profile: LuaMRescueMedicBehavior
    writeHtnBlackboard: false
    externalEvaluationOnly: true
  - type: Medibot
    treatments:
      Alive:
        reagent: Tricordrazine
        quantity: 15
        minDamage: 0
      Critical:
        reagent: Inaprovaline
        quantity: 20
  - type: HTN
    pauseWhenNoPlayersInRange: false
    rootTask:
      task: LuaMRescueAgentCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.25
      FollowRange: !type:Single
        1.5
      IdleRange: !type:Single
        4.0
      MedibotInjectRange: !type:Single
        6.0
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        1.5
      NavInteract: !type:Bool
        true
      NavAccess: !type:Bool
        true

- type: entity
  parent: MobHuman
  id: LuaMRescueEscort
  name: LuaM rescue escort
  suffix: LuaM, Autonomous Escort
  description: Автономный сопровождающий спасательной группы LuaM.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes:
    - LuaMRescueEscortGear
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: InputMover
  - type: MobMover
  - type: LuaMRescuePersonnel
  - type: LuaMRescueEscort
  - type: LuaMRescueBehaviorAdapter
  - type: LuaMBehaviorAgent
    profile: LuaMRescueCrewBehavior
    writeHtnBlackboard: false
    externalEvaluationOnly: true
  - type: HTN
    pauseWhenNoPlayersInRange: false
    rootTask:
      task: LuaMRescueEscortCompound
    blackboard:
      FollowCloseRange: !type:Single
        1.75
      FollowRange: !type:Single
        5.0
      IdleRange: !type:Single
        4.0
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        1.5
      NavInteract: !type:Bool
        true
      NavAccess: !type:Bool
        true
