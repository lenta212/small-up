# Text-only LuaM compatibility replacement for Radiant's 2x2 ThrusterZeta.
# The original CC-BY-SA sprite was deliberately not imported; this variant reuses LuaM's attributed large-thruster RSI.
# Gameplay values follow: https://github.com/TetrisZz/frontier-Radiant/blob/28d354a3a6fffa63b553d6e487dd53d66053156a/Resources/Prototypes/_radiant/Entities/Structures/Shuttles/thrusters.yml
- type: entity
  id: ThrusterRadiantMediumLuaM
  parent: ThrusterLarge
  name: крупный двигатель
  suffix: LuaM, 300 Н
  components:
  - type: Thruster
    baseThrust: 300
    thrust: 300
    thrustPerPartLevel: [390, 510, 630, 750]
    damage:
      types:
        Heat: 40
  - type: ApcPowerReceiver
    powerLoad: 3750
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,1.5,1.5"
        density: 200
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _Mono/Structures/Shuttles/thruster_large.rsi
    offset: 0.5,0.5
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 2
