- type: entity
  parent: BaseShipLPC
  id: ShipVoucherScorpionLuaM
  name: uplink-pdv-t1-scorpion-voucher-name
  description: uplink-pdv-t1-scorpion-voucher-desc
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon
    - state: screen
      color: "#1eff00"
    - state: screen6
      color: "#1eff00"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 7200 # one hour
    consoleType: BlackMarket
    companyName: PDV
    vessels:
    - ScorpionLuaM
  - type: StaticPrice
    vendPrice: 20000

