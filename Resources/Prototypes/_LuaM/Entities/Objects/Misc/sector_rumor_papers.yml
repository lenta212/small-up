- type: entity
  parent: Paper
  id: PaperLuaMSectorRumorTemplates
  name: шаблоны доски слухов сектора
  description: Лист повторно используемых зацепок для аварийных маяков и фронтирных контрактов.
  components:
  - type: Paper
    content: |2
      # Доска слухов сектора

      Используйте эти зацепки для PDA-контрактов, новостей, радиообъявлений и малых админских сцен.

      1. Тихий буксир
      Малый корабль просит стыковку. Голоса нет, транспондер меняет имя судна, на борту может быть чёрный ящик.

      2. Последний кислород
      Шахтёрский модуль сообщает о пробоине. Один шлюз заблокирован изнутри, журнал доступа повреждён.

      3. Чужой груз
      Торговец платит за сопровождение контейнера, который нельзя открывать до прибытия.

      4. Ложная тишина
      Аванпост передаёт нормальную телеметрию, но все сообщения написаны одним и тем же человеком.

      5. Слепая проводка
      Станции нужен инженер: питание есть, но сеть связи глохнет при каждой попытке вызова помощи.

      Формат контракта:
      - Название: короткий крючок.
      - Судно: где искать.
      - Описание: кто зовёт, что случилось, какие риски, что считать успехом.
      - Награда: деньги, услуга, доля добычи, ремонт, лечение или транспорт.

- type: entity
  parent: Paper
  id: PaperLuaMDistressContractCards
  name: карточки аварийных контрактов
  description: Готовые карточки контрактов КПК для одиночных сцен спасения, ремонта, доставки и расследования.
  components:
  - type: Paper
    content: |2
      # PDA-карточки сигналов бедствия

      Используй эти карточки как быстрые шаблоны для коллекции "Сигналы бедствия". Каждая задача должна закрываться одним игроком: результатом считается отчёт, маяк, груз, координаты, ремонт или новый контракт.

      ## Vacancy: одинокий вызов

      Название: Нужен пилот на короткий вылет
      Описание: Автоматический сигнал просит проверить точку на окраине сектора. Живого заказчика может не быть. Успех: добраться, поставить маяк, оставить отчёт о том, что найдено.
      Награда: оплата за координаты, найденный груз или подтверждённую безопасность маршрута.

      ## Construction: слепая проводка

      Название: Восстановить связь аванпоста
      Описание: Малый объект передаёт питание, но не отвечает по радио. Успех: проверить питание, шлюз или консоль, описать оставшиеся риски.
      Награда: оплата за ремонт, список нужных деталей или следующий контракт на доставку.

      ## Service: чужой груз

      Название: Доставить опечатанный контейнер
      Описание: Контейнер нельзя вскрывать до прибытия. Успех: доставить, отметить повреждения пломб или оставить акт о потере.
      Награда: фиксированная оплата, доля спасённого груза или услуга владельца.

      ## Other: чёрный ящик

      Название: Расшифровать аварийный журнал
      Описание: Найден регистратор рейса. Успех: прочитать запись, заполнить отчёт, указать вероятную причину аварии и оставить крючок для следующей смены.
      Награда: оплата за отчёт, координаты места аварии или право на часть безопасной добычи.

      ## Правило завершения

      Не пиши контракт, который требует второго живого персонажа. Если игрок один, он всё равно должен иметь честный способ закончить сцену и оставить след.

- type: entity
  parent: Paper
  id: PaperLuaMSoloObjectiveTable
  name: таблица одиночных задач
  description: Компактная таблица для генерации секторных задач на одного игрока без админской подготовки.
  components:
  - type: Paper
    content: |2
      # Генератор одиночной задачи

      Если в секторе один игрок, выбери по одному пункту из каждого блока или брось кубик. Получится задача на 20-40 минут, которую можно закрыть без второго персонажа.

      ## 1. Источник сигнала

      1. старый PDA-контракт без исполнителя
      2. аварийный маяк без голоса
      3. контейнер с запиской
      4. обрывок телеметрии
      5. чёрный ящик
      6. слух из новостей сектора

      ## 2. Работа

      1. проверить место
      2. доставить груз
      3. восстановить питание или связь
      4. сопроводить маршрут
      5. заполнить отчёт
      6. оставить новый контракт

      ## 3. Риск

      1. мало кислорода
      2. повреждён шлюз
      3. помехи связи
      4. подозрительный груз
      5. неверные координаты
      6. неизвестная причина аварии

      ## 4. Доказательство завершения

      1. маяк на карте
      2. заполненная бумага
      3. PDA-контракт
      4. новость сектора
      5. доставленный предмет
      6. координаты для следующего игрока

      ## 5. Награда

      1. деньги
      2. доля груза
      3. ремонт или заправка
      4. медицинская услуга
      5. репутация персонажа
      6. право на следующий контракт

      ## 6. Крючок

      1. сигнал повторился
      2. владелец груза неизвестен
      3. отчёт противоречит телеметрии
      4. найден второй маршрут
      5. кто-то уже был на месте
      6. награда требует обратного рейса

