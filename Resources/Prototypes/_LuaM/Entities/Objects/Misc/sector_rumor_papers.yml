- type: entity
  parent: Paper
  id: PaperLuaMSoloBountyGuide
  name: руководство по одиночным грузовым наградам
  description: Короткое полевое руководство для выполнения грузовых наград на малом онлайне без второго игрока.
  components:
  - type: Paper
    content: |2
      # Одиночные грузовые заявки

      Эти заявки нужны, чтобы один игрок мог получить честную оплату за маленькую сцену без живого заказчика и без ручной выдачи денег администрацией.

      Перед вылетом можно взять одиночный полевой набор: GPS, переносная связь, фонарь и аварийный медипен закрывают базовую разведку и маршрутные заявки.

      ## Как закрыть заявку

      1. Открой грузовую консоль заявок и выбери заявку с префиксом DS.
      2. Распечатай label заявки.
      3. Собери предметы из манифеста в один ящик.
      4. Всегда добавь письменный итог: одиночный отчет, отчет черного ящика или договор спасработ.
      5. Прикрепи label к ящику и продай его через грузовую систему.

      ## Что считается доказательством

      Сигнал бедствия: аварийный маяк и отчет о том, что найдено.
      Черный ящик: регистратор или отчет черного ящика, плюс отдельный итоговый отчет.
      Полевой ремонт: два рабочих инструмента и отчет о проверенной неисправности.
      Маршрутный пакет: GPS или переносная связь, плюс координаты или заметки маршрута.

      ## Антифарм

      Не закрывай заявку пустым ящиком с предметами без истории. Если ты получил оплату, оставь в отчете координаты, риск, результат и крючок для следующего игрока.

      Если заявка повторилась слишком быстро, выбери другой тип работы или преврати ее в PDA-контракт, новость сектора, ремонтную ведомость или маяк для следующей смены.

- type: entity
  parent: Paper
  id: PaperLuaMSoloFallbackProtocol
  name: протокол одиночного обхода
  description: Короткий протокол закрытия заблокированной работы, когда нет второго игрока, командования или клиента.
  components:
  - type: Paper
    content: |2
      # Протокол одиночного fallback

      Если механика требует второго игрока, командование, живого заказчика, отдельную роль или закрытый доступ, не стой в тупике. Преврати задачу в одиночный след.

      ## Порядок

      1. Опиши блокер: какой доступ, роль, консоль или живой игрок нужен.
      2. Выполни безопасную часть работы: разведка, осмотр, эвакуация, маркировка, ремонт снаружи.
      3. Оставь доказательство: отчет, маяк, GPS-координаты, PDA-контракт, новость или грузовой label.
      4. Если нужна оплата, закрой через DS cargo bounty или оставь PDA-контракт на продолжение.
      5. Если нужен доступ, запиши, куда и зачем. Админ или старшая роль смогут проверить позже.

      ## Примеры fallback

      Нет инженера: отметь поломку маяком, почини доступную часть, оставь ремонтную заявку.
      Нет медика: стабилизируй себя, забери тело или доказательства, оставь медицинский отчет.
      Нет охраны: не играй в тюрьму. Опиши угрозу, маркируй зону, выдай предупреждение.
      Нет заказчика: закрой через отчет, новость, грузовую заявку или контракт для следующего.
      Нет доступа: не ломай критичную игру. Оставь точное место, причину и минимальный запрос.

      ## Проверка честности

      [ ] Игрок не получил бесконечную награду.
      [ ] Остался риск или цена действия.
      [ ] Есть доказательство в мире.
      [ ] Следующий игрок сможет продолжить.
      [ ] Админ не обязан быть онлайн.

- type: entity
  parent: Paper
  id: PaperLuaMSoloRoleLoops
  name: карточки одиночных ролевых циклов
  description: Короткие ролевые циклы для сохранения играбельности сектора при одном игроке онлайн.
  components:
  - type: Paper
    content: |2
      # Одиночные циклы ролей

      Если ты один в секторе, выбери короткий цикл и оставь след.

      ## Кем стартовать одному

      Авантюрист - базовая роль без таймера. Она подходит для первого одиночного вылета, DS-грузовых заявок, маяков, отчетов и маленьких контрактов.

      Пилот открывается после базового опыта и лучше подходит для маршрутов, буксировки и перевозки груза. Если роль еще закрыта, бери авантюриста и полевой набор.

      Старшие роли не нужны для закрытия одиночной сцены. Если в секторе один игрок, не жди начальника: оставь отчет, маяк, PDA-контракт или cargo bounty как доказательство.

      ## Спасатель
      Найди сигнал, проверь корпус, поставь маяк, верни груз или отчёт.

      ## Инженер
      Восстанови питание, связь, шлюз или маршрут. Оставь записку: что починено и что осталось опасным.

      ## Медик
      Проверь место происшествия, собери медицинскую картину, эвакуируй тело или оставь запрос на лекарства.

      ## Курьер
      Доставь груз, проверь пломбы, отметь повреждения и оставь подтверждение доставки.

      ## Охрана
      Проверь угрозу, обозначь опасный район, сопроводительное условие или запрос NFSD. Бой не обязан быть целью.

      ## Сервис / репортёр
      Создай новость, слух, объявление, устав компании или список услуг. Пустой сектор тоже может получить историю.

      ## Проверка завершения
      [ ] цель была понятна
      [ ] риск не заблокировал игру
      [ ] есть результат
      [ ] остался след для следующих игроков

- type: entity
  parent: Paper
  id: PaperLuaMSoloFirstChecklist
  name: чеклист механик для одиночной игры
  description: Чеклист для адаптации любой секторной сцены под одного игрока онлайн.
  components:
  - type: Paper
    content: |2
      # Проверка механики на одного игрока

      Используй перед контрактом, ивентом, новой ролью или админской сценой. Если онлайн один человек, сцена должна закрываться без второго живого персонажа.

      ## Пять обязательных ответов

      Что игрок делает в первые пять минут:

      Чем он рискует, кроме мгновенной смерти:

      Что считается честным завершением:

      Какой след останется в мире:
      [ ] бумага
      [ ] PDA-контракт
      [ ] маяк
      [ ] новость
      [ ] груз / предмет
      [ ] координаты

      Как следующий игрок сможет продолжить:
      [ ] спасти
      [ ] починить
      [ ] купить
      [ ] оспорить
      [ ] расследовать
      [ ] доставить

      ## Нельзя для низкого онлайна

      [ ] требуется второй игрок у консоли
      [ ] нужен живой заказчик для завершения
      [ ] требуется командное одобрение
      [ ] провал мгновенно заканчивает раунд
      [ ] награда фармится без риска
      [ ] роль существует только чтобы ждать нарушителя

      Если отмечен любой пункт выше, добавь fallback: аварийный доступ, бумажное доказательство, маяк, частичную оплату, новый контракт или локальную поломку вместо глобальной катастрофы.

- type: entity
  parent: Paper
  id: PaperLuaMLowPopEventPolicy
  name: политика событий малого онлайна
  description: Быстрая шкала онлайна для выбора событий, работающих при малом числе игроков.
  components:
  - type: Paper
    content: |2
      # События при низком онлайне

      ## 1 игрок

      Только локальная сцена, которую можно закрыть одному:
      [ ] сигнал бедствия
      [ ] черный ящик
      [ ] сломанный маяк, шлюз, связь или генератор
      [ ] потерянный груз
      [ ] подозрительный контейнер
      [ ] слух сектора

      Запрещено:
      [ ] глобальная авария станции
      [ ] обязательный бой
      [ ] цель с живым противником
      [ ] угроза без отступления

      ## 2-4 игрока

      Можно:
      [ ] спасательный вызов
      [ ] сопровождение груза
      [ ] ремонт опасной зоны
      [ ] медицинский вылет
      [ ] спор по контракту

      ## 5-10 игроков

      Можно:
      [ ] фракционный маршрут
      [ ] рискованная экспедиция
      [ ] атака на груз
      [ ] публичный репутационный конфликт

      ## 10+ игроков

      Можно:
      [ ] большой рейд
      [ ] сильный антагонист
      [ ] командная операция
      [ ] масштабная авария

      Если онлайн падает, следующая волна должна стать тише или превратиться в контракт, маяк, новость, отчет или координаты.

      Тихий стартовый пресет: LuaMDeadSpaceLowPop.
      Используй его, если сервер пустой или почти пустой, а цель - дать игрокам контракты, salvage и медленные угрозы без постоянного тяжелого давления.

      Для постоянного тихого старта сервера: config.presets = "_Mono/monolithCore,_LuaM/deadSpaceLowPop"

- type: entity
  parent: Paper
  id: PaperLuaMSoloMechanicsMatrix
  name: матрица одиночных механик
  description: Компактный лист правил для проверки, работает ли механика с одним игроком онлайн.
  components:
  - type: Paper
    content: |2
      # Матрица одиночной механики

      Любая сцена, роль, контракт или событие должны работать, даже если в секторе один человек.

      ## Шесть обязательных ответов

      [ ] Что игрок делает в первые пять минут?
      [ ] Чем он рискует, кроме мгновенной смерти?
      [ ] Как он завершает задачу без второго живого персонажа?
      [ ] Какой след остается в мире: бумага, маяк, координаты, груз, PDA-контракт, новость или черный ящик?
      [ ] Как следующий игрок сможет продолжить, купить, спасти, расследовать или починить?
      [ ] Почему награду нельзя бесконечно фармить без риска и истории?

      ## Fallback вместо тупика

      Нет доступа: оставь место, причину, координаты и минимальный запрос, не ломай критичную игру ради прохода.
      Нет роли: возьми базовый вариант задачи через подрядчика, отчет, маяк или PDA-контракт.
      Нет медика: стабилизируй себя и оставь медицинский отчет, но не заменяй полноценную больницу.
      Нет инженера: почини доступную часть, отметь опасное место и создай ремонтную заявку.
      Нет заказчика: закрывай через отчет, cargo bounty, новость, грузовой label или контракт для следующей смены.

      ## Правило low-pop

      Для одного игрока разрешены разведка, salvage, малый ремонт, доставка, самоспасение, маяки, отчеты и черные ящики. Массовые рейды, обязательный бой, глобальные аварии и цели с живым противником ждут большего онлайна.

