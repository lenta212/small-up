- type: entity
  parent: BaseItem
  id: LuaMBlackBoxRecorder
  name: восстановленный черный ящик
  description: Прочный бортовой регистратор с читаемым аварийным журналом. Полезен даже когда сектор пуст.
  components:
  - type: Tag
    tags:
    - LuaMBlackBoxBounty
  - type: LuaMSectorEvidence
    story: LuaMSectorStoryBlackBoxPaid
    acknowledgeHazard: true
    recoverBlackBox: true
    resolveStory: true
    note: "recovered black box recorder filed"
  - type: Sprite
    sprite: _LuaM/Objects/Monolith/flight_recorder.rsi
    state: icon
  - type: Icon
    sprite: _LuaM/Objects/Monolith/flight_recorder.rsi
    state: icon
  - type: Paper
    contentSize: 12000
    content: |2
      # Чёрный ящик: одиночная расшифровка

      Статус: найденный аварийный регистратор.
      Назначение: дать задачу одному пилоту, спасателю, инженеру или курьеру без ожидания других игроков.

      ## Последняя запись

      Судно потеряло связь после короткого всплеска помех. Автопилот успел сохранить маршрут, отметку груза и обрывок голосового журнала. Живых свидетелей может не быть, но запись достаточно полная, чтобы завершить работу документами.

      ## Как закрыть сцену одному

      1. Отметь место находки маяком или координатами.
      2. Проверь корпус, груз, угрозы и признаки выживших.
      3. Заполни отчёт чёрного ящика или одиночный журнал контракта.
      4. Оставь результат в PDA-контракте, новости, бумаге на станции или у администрации.
      5. Если данных мало, оформи следующий контракт: эвакуация, буксировка, ремонт, доставка груза или расследование.

      ## Награда без второго игрока

      Завершением считается не только спасение человека. Засчитывается доставленный груз, найденная причина аварии, безопасно поставленный маяк, честный отчёт, проданные координаты или подготовленный контракт для следующей смены.

      ## Крючки для продолжения

      - Последний сигнал пришёл не с того борта, что указан в манифесте.
      - Груз опечатан, но пломбы не совпадают.
      - В журнале есть просьба не отдавать запись корпорации.
      - Маршрут ведёт к пустому месту, где всё ещё работает маяк.
      - Автопилот помнит второго пассажира, которого нет в списках.
