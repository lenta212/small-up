- type: entity
  id: LuaMExpeditionRewardCacheModerate
  parent: CrateGenericSteel
  name: экспедиционный технологический тайник
  description: Защищённый контейнер аванпоста. Внутри находится технология и редкое вооружение, но не сырьё.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: LuaMExpeditionTechnologyModerate
        - !type:NestedSelector
          tableId: LuaMExpeditionWeaponModerate

