      weight: 1700
    - stimulus: ObjectiveThreatened
      weight: 1900

  - id: support-revive
    intent: Revive
    tier: Support
    baseScore: 1000
    requiredCapabilities: [ Medical, Defibrillate ]
    requiredAll: [ RecoverableDeadAlly ]
    weights:
    - stimulus: RecoverableDeadAlly
      weight: 2200
    targetFrom: RecoverableDeadAlly
    requireTarget: true

  - id: support-treat-critical
    intent: Treat
    tier: Support
    baseScore: 950
    requiredCapabilities: [ Medical ]
    requiredAll: [ AllyCritical ]
    weights:
