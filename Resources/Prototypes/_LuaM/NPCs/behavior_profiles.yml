      weight: 2100
    targetFrom: AllyCritical
    requireTarget: true

  - id: support-treat-injured
    intent: Treat
    tier: Support
    baseScore: 700
    requiredCapabilities: [ Medical ]
    requiredAll: [ AllyInjured ]
    weights:
    - stimulus: AllyInjured
      weight: 1400
    targetFrom: AllyInjured
    requireTarget: true

  - id: support-evacuate-casualty
    intent: EvacuateCasualty
    tier: Support
    baseScore: 760
    requiredCapabilities: [ Move, Pull ]
    requiredAny: [ AllyCritical, PatientWaiting ]
    weights:
    - stimulus: AllyCritical
      weight: 1500
    - stimulus: PatientWaiting
      weight: 1200

  - id: support-extinguish-fire
    intent: ExtinguishFire
    tier: Support
    baseScore: 850
    requiredCapabilities: [ Extinguish ]
    requiredAny: [ LocalFire, FireNeedsExtinguishing ]
    weights:
    - stimulus: LocalFire
      weight: 1800
    - stimulus: FireNeedsExtinguishing
      weight: 1700
    targetFrom: FireNeedsExtinguishing

  - id: support-clean-hazard
    intent: Clean
    tier: Support
    baseScore: 625
    requiredCapabilities: [ Clean ]
    requiredAll: [ CleaningNeeded ]
    weights:
    - stimulus: CleaningNeeded
      weight: 1300
    targetFrom: CleaningNeeded
    requireTarget: true

  - id: support-seal-breach
    intent: SealBreach
    tier: Support
    baseScore: 825
    requiredCapabilities: [ SealBreach ]
    requiredAny: [ HullBreach, BreachNeedsSealing ]
    weights:
    - stimulus: HullBreach
      weight: 1900
    - stimulus: BreachNeedsSealing
      weight: 1800
    targetFrom: BreachNeedsSealing

  - id: support-restore-power
    intent: RestorePower
    tier: Support
    baseScore: 725
    requiredCapabilities: [ RestorePower ]
    requiredAny: [ PowerFailure, DeviceNeedsPower ]
    weights:
    - stimulus: PowerFailure
      weight: 1500
    - stimulus: DeviceNeedsPower
      weight: 1400
    targetFrom: DeviceNeedsPower

  - id: support-repair
    intent: Repair
    tier: Support
    baseScore: 650
    requiredCapabilities: [ Repair ]
    requiredAny: [ RepairNeeded, StructuralFailure ]
    weights:
