# High-level arbitration shared by LuaM bodies, ships, service machines, and
# animals. Domain executors remain responsible for carrying out each intent.
- type: luamBehaviorProfile
  id: LuaMUniversalBehaviorBase
  abstract: true
  defaultIntent: Standby
  defaultTier: Idle
  decisionIntervalSeconds: 0.5
  sameTierPreemptMargin: 100
  perceptionRange: 12
  threatTolerance: 2
  maxObservations: 64
  rules:
  - id: hard-stop-incapacitated
    intent: AwaitRescue
    tier: HardStop
    baseScore: 1000
    requiredAll: [ SelfIncapacitated ]
    weights:
    - stimulus: SelfIncapacitated
      weight: 2000
    commitSeconds: 2
    interruptible: false

  - id: critical-extinguish-self
    intent: ExtinguishSelf
    tier: Critical
    baseScore: 950
    requiredCapabilities: [ FireVulnerable, Extinguish ]
    requiredAll: [ SelfOnFire ]
    weights:
    - stimulus: SelfOnFire
      weight: 2000
    targetFrom: SelfOnFire

  - id: critical-flee-self-fire
    intent: Flee
    tier: Critical
    baseScore: 800
    requiredCapabilities: [ FireVulnerable, Move ]
    requiredAll: [ SelfOnFire ]
    weights:
    - stimulus: SelfOnFire
      weight: 1800

  - id: critical-seek-safe-atmosphere
    intent: SeekSafeAtmosphere
    tier: Critical
    baseScore: 900
    requiredCapabilities: [ Breathe, Move ]
    requiredAny: [ UnsafeAtmosphere, LowPressure, HighPressure ]
    weights:
    - stimulus: UnsafeAtmosphere
      weight: 2200
    - stimulus: LowPressure
      weight: 2000
    - stimulus: HighPressure
      weight: 1800

  - id: critical-evacuate-temperature
    intent: EvacuateHazard
    tier: Critical
    baseScore: 850
    requiredCapabilities: [ TemperatureVulnerable, Move ]
    requiredAll: [ ExtremeTemperature ]
    weights:
    - stimulus: ExtremeTemperature
      weight: 2000

  - id: critical-evacuate-radiation
    intent: EvacuateHazard
    tier: Critical
    baseScore: 875
    requiredCapabilities: [ RadiationVulnerable, Move ]
    requiredAll: [ RadiationHazard ]
    weights:
    - stimulus: RadiationHazard
      weight: 2100

  - id: critical-evacuate-immediate-hazard
    intent: EvacuateHazard
    tier: Critical
    baseScore: 825
    requiredCapabilities: [ Move ]
    requiredAny: [ ExplosionRisk, ElectricalHazard, ContaminationHazard, HullBreach ]
    weights:
    - stimulus: ExplosionRisk
      weight: 2300
    - stimulus: ElectricalHazard
      weight: 1900
    - stimulus: ContaminationHazard
      weight: 2000
    - stimulus: HullBreach
      weight: 2100

  - id: critical-seek-medical-aid
    intent: SeekMedicalAid
    tier: Critical
    baseScore: 700
    requiredCapabilities: [ SelfPreservation, Move ]
    requiredAll: [ SelfCritical ]
    weights:
    - stimulus: SelfCritical
      weight: 1800

  - id: safety-evade-projectile
    intent: EvadeProjectile
    tier: Safety
    baseScore: 950
    requiredCapabilities: [ Move ]
    requiredAll: [ ProjectileThreat ]
    forbidden: [ Immobilized ]
    weights:
    - stimulus: ProjectileThreat
      weight: 1900

  - id: safety-disengage-damaged-ship
    intent: DisengageShip
    tier: Safety
    baseScore: 900
    requiredCapabilities: [ ShipControl ]
    requiredAll: [ HostileThreat ]
    requiredAny: [ LowPower, LowFuel, LowAmmunition, Overwhelmed ]
    weights:
    - stimulus: HostileThreat
      weight: 1000
    - stimulus: LowPower
      weight: 1800
    - stimulus: LowFuel
      weight: 1700
    - stimulus: LowAmmunition
      weight: 1600
    - stimulus: Overwhelmed
      weight: 1900
    targetFrom: HostileThreat

  - id: safety-disengage-civilian-ship
    intent: DisengageShip
    tier: Safety
    baseScore: 850
    requiredCapabilities: [ ShipControl ]
    forbiddenCapabilities: [ ShipWeapons ]
    requiredAll: [ HostileThreat ]
    weights:
    - stimulus: HostileThreat
      weight: 1700
    targetFrom: HostileThreat

  - id: safety-retreat-overwhelmed
    intent: Retreat
    tier: Safety
    baseScore: 825
    requiredCapabilities: [ Move ]
    requiredAll: [ Overwhelmed ]
    forbidden: [ Immobilized ]
    weights:
    - stimulus: Overwhelmed
      weight: 1800
    targetFrom: Overwhelmed

  - id: safety-flee-unarmed-threat
    intent: Flee
    tier: Safety
    baseScore: 700
    requiredCapabilities: [ Move ]
    forbiddenCapabilities: [ CombatMelee, CombatRanged, ShipWeapons ]
    requiredAll: [ HostileThreat ]
    forbidden: [ Immobilized ]
    weights:
    - stimulus: HostileThreat
      weight: 1600
    targetFrom: HostileThreat

  - id: safety-defend-while-immobilized
    intent: DefendSelf
    tier: Safety
    baseScore: 775
    requiredAnyCapabilities: [ CombatMelee, CombatRanged ]
    requiredAll: [ HostileThreat, Immobilized ]
    weights:
    - stimulus: HostileThreat
      weight: 1700
    - stimulus: Immobilized
      weight: 500
    targetFrom: HostileThreat
    requireTarget: true

  - id: safety-take-cover-low-ammunition
    intent: TakeCover
    tier: Safety
    baseScore: 750
    requiredCapabilities: [ Move, CombatRanged ]
    forbiddenCapabilities: [ CombatMelee ]
    requiredAll: [ HostileThreat, LowAmmunition ]
    forbidden: [ Immobilized ]
    weights:
    - stimulus: HostileThreat
      weight: 1400
    - stimulus: LowAmmunition
      weight: 1800
    targetFrom: HostileThreat
    requireTarget: true

  - id: safety-recharge-critical
    intent: Recharge
    tier: Safety
    baseScore: 850
    requiredCapabilities: [ Recharge ]
    requiredAll: [ LowPower ]
    forbidden: [ HostileThreat ]
    minimumSignal: 0.75
    weights:
    - stimulus: LowPower
      weight: 2100

  - id: safety-request-help-immobilized
    intent: RequestAssistance
    tier: Safety
    baseScore: 650
    requiredCapabilities: [ Communicate ]
    requiredAll: [ Immobilized ]
    weights:
    - stimulus: Immobilized
      weight: 1500

  - id: safety-request-help-stranded
    intent: RequestAssistance
    tier: Safety
    baseScore: 600
    requiredCapabilities: [ Communicate ]
    requiredAll: [ Stranded ]
    weights:
    - stimulus: Stranded
      weight: 1500

  - id: safety-stationary-weapon-unavailable
    intent: RequestAssistance
    tier: Safety
    baseScore: 900
    requiredCapabilities: [ Stationary, Communicate ]
    requiredAll: [ HostileThreat ]
    requiredAny: [ LowAmmunition, LowPower ]
    weights:
    - stimulus: HostileThreat
      weight: 1200
    - stimulus: LowAmmunition
      weight: 2200
    - stimulus: LowPower
      weight: 2200

  - id: combat-engage-ship
    intent: EngageShip
    tier: Combat
    baseScore: 850
    requiredCapabilities: [ ShipControl, ShipWeapons ]
    requiredAll: [ HostileThreat ]
    forbidden: [ LowPower, LowFuel, Overwhelmed ]
    weights:
    - stimulus: HostileThreat
      weight: 1700
    targetFrom: HostileThreat
    requireTarget: true

  - id: combat-defend-self
    intent: DefendSelf
    tier: Combat
    baseScore: 800
    requiredAnyCapabilities: [ CombatMelee, CombatRanged ]
    requiredAll: [ HostileThreat ]
    forbidden: [ Overwhelmed ]
    weights:
    - stimulus: HostileThreat
      weight: 1600
    targetFrom: HostileThreat
    requireTarget: true

  - id: combat-defend-area
    intent: DefendArea
    tier: Combat
    baseScore: 900
    requiredCapabilities: [ Guard ]
    requiredAnyCapabilities: [ CombatMelee, CombatRanged ]
    requiredAny: [ Intruder, ObjectiveThreatened ]
    weights:
