- type: entity
  id: BaseCyberneticOrgan
  parent: BaseHumanOrgan
  abstract: true
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Misc/Cybernetics/organs.rsi
  - type: Tag
    tags:
    - Organ

# Eyes

- type: entity
  parent: BaseCyberneticOrgan
  id: BasicCyberneticEyes
  name: cybernetic eyes
  description: A pair of cybernetic eyes that improve vision and protect against eye damage.
  components:
  - type: Sprite
    state: eyes
  - type: Organ
    slotId: eyes
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
  - type: Tag
    tags:
    - Eyes
  - type: Eyes
  - type: PirateBountyItem
    id: Cybernetics

- type: entity
  parent: BasicCyberneticEyes
  id: SecurityCyberneticEyes
  name: cybernetic security eyes
  description: Cybernetic eyes with an integrated security HUD.
  components:
  - type: Sprite
    state: eyes-sechud
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  parent: BasicCyberneticEyes
  id: MedicalCyberneticEyes
  name: cybernetic medical eyes
  description: Cybernetic eyes with an integrated medical HUD.
  components:
  - type: Sprite
    state: eyes-medhud
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowHealthBars
      damageContainers:
      - Biological
    - type: ShowHealthIcons
      damageContainers:
      - Biological

- type: entity
  parent: BasicCyberneticEyes
  id: DiagnosticCyberneticEyes
  name: cybernetic diagnostic eyes
  description: Cybernetic eyes with an integrated diagnostic HUD for synthetic patients.
  components:
  - type: Sprite
    state: eyes-diagnostic
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
    - type: ShowHealthIcons
      damageContainers:
      - Inorganic
      - Silicon

# Heart

- type: entity
  parent: BaseCyberneticOrgan
  id: BasicCyberneticHeart
  name: cybernetic heart
  description: A precision circulatory pump that processes medicine slowly while accelerating poisons and narcotics.
  components:
  - type: Sprite
    state: heart-on
  - type: Heart
  - type: Organ
    slotId: heart
    onAdd:
    - type: StaminaModifier
      modifier: 1.35
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]
    groups:
    - id: Medicine
      rateModifier: 0.7
    - id: Poison
      rateModifier: 1.4
    - id: Narcotic
      rateModifier: 1.2
  - type: Tag
    tags:
    - Organ
    - Heart
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  parent: BasicCyberneticHeart
  id: UpgradedCyberneticHeart
  name: upgraded cybernetic heart
  description: A reinforced circulatory core that improves stamina and protects the body from pressure while heavily accelerating poisons and narcotics.
  components:
  - type: Sprite
    state: heart-u-on
  - type: Organ
    onAdd:
    - type: StaminaModifier
      modifier: 1.7
    - type: PressureImmunity
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]
    groups:
    - id: Medicine
      rateModifier: 0.4
    - id: Poison
      rateModifier: 2.8
    - id: Narcotic
      rateModifier: 1.6

# Liver

- type: entity
  parent: BaseCyberneticOrgan
  id: BasicCyberneticLiver
  name: cybernetic liver
  description: A synthetic liver that filters the harmful side effects of alcohol while preserving intoxication.
  components:
  - type: Liver
  - type: Organ
    slotId: liver
  - type: Sprite
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer
    metabolizerTypes: [ Cybernetic ]
    groups:
    - id: Alcohol
      rateModifier: 0.1
  - type: Tag
    tags:
    - Organ
    - Liver

# Lungs

- type: entity
  parent: BaseCyberneticOrgan
  id: BasicCyberneticLungs
  name: cybernetic lungs
  description: Synthetic lungs that process oxygen and nitrogen, ignore carbon dioxide, and resist most atmospheric hazards.
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Organ
    slotId: lungs
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
    metabolizerTypes: [ Cybernetic ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 100.0
        canReact: false
  - type: Tag
    tags:
    - Organ

- type: entity
  parent: BasicCyberneticLungs
  id: UpgradedCyberneticLungs
  name: upgraded cybernetic lungs
  description: A self-contained respiratory system that removes the need to breathe.
  components:
  - type: Sprite
    layers:
    - state: lung-u-l
    - state: lung-u-r
  - type: Organ
    onAdd:
    - type: BreathingImmunity
