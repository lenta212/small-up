  - type: Fix
    message: 'Генератор щита после вызова корабля создаёт новую рабочую защитную оболочку и сохраняет повреждение, фазу перезарядки и накопленную перегрузку; отменённый или неудачный вызов больше не оставляет фантомный щит.'
