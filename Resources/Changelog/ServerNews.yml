    message: 'После получения сохранённого корабля восстанавливаются выданные владельцу доступы к панелям вентиляции, шлюзам и другим защищённым устройствам. Это исправление не создаёт сетевые связи: новая воздушная сигнализация по-прежнему подключается мультитулом к нужным вентам и скрубберам. Кнопки и рычаги больше не сохраняют блокирующие таймеры предыдущего раунда.'
  - type: Fix
    message: 'Сумки и другие хранилища на восстановленном корабле снова открываются обычным нажатием без бесконечного индикатора загрузки и без обязательного использования отдельного пункта меню.'
  - type: Fix
    message: 'Экспедиционная консоль после загрузки корабля восстанавливает привязку к станции, интерфейс и активный отсчёт экспедиции; её кнопки снова выполняют команды.'
  - type: Fix
