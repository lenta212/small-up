    message: 'Штатный Айболит получил анализатор здоровья, не изображает диагностику без прибора и повторно ищет способ лечения после ограниченной паузы вместо вечного отказа.'
  - type: Fix
    message: 'Радиовызовы помощи и эвакуации теперь создают настоящее задание для свободного Айболита, если персонажу действительно нужна медицинская помощь, и не сбрасывают уже принятого пациента.'
  - type: Fix
    message: 'Айболит может проводить локальную дефибрилляцию без назначенного шаттла и завершает безнадёжную попытку без бесконечного преследования пациента.'

