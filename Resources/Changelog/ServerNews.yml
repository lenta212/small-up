  - type: Fix
    message: 'Консоли показывают заряд реально работающего генератора щита, включая корректный процент после загрузки корабля. Повреждение, перезарядка и перегрузка щита сохраняются без появления фантомного генератора.'
  - type: Fix
    message: 'Повреждённые или некорректные числовые значения сохранённой энергосети больше не оставляют APC, подстанции, зарядные устройства и шаттл без питания: состояние нормализуется и сеть вновь получает энергию от исправных генераторов и SMES.'
  - type: Tweak
    message: 'Снижены боевые лаги от корабельного ИИ: скорость целей продолжает обновляться каждый тик, а тяжёлый расчёт наведения и выбора огня выполняется с ограниченной частотой. Скорострельность и штатные задержки оружия не изменены.'
  - type: Fix
    message: 'Айболит больше не теряет пациента во время лечения, правильно завершает ограниченную серию дефибрилляций, не продолжает закрытую задачу и удерживает пациента на койке до подтверждённой взаимной физической стыковки при передаче домой.'

  - type: Tweak
    message: 'Айболит получил устойчивый выбор приоритетной цели, полезного лекарства и маршрута, корректную работу на движущихся сетках, в вакууме и невесомости, а также расширенную диагностику повторов, защитных ограничителей и обязательной передачи пациентов.'

