  changes:
  - type: Add
    message: 'Слаймолюды и их мини-форма могут проползать между вентиляционными насосами одной трубной сети. Для входа нужно находиться рядом с другим вентом, полностью освободить руки, карманы и слоты экипировки; переход имеет восьмисекундную перезарядку, а несвязанные сети не подходят.'

- author: LuaM
  id: 2026080209
  time: '2026-08-02T06:00:24.2954377+00:00'
  changes:
  - type: Add
    message: 'Дионы получили способность укореняться на твёрдой поверхности. В этом состоянии они полностью неподвижны и расходуют питание, постепенно восстанавливая ударные, рубящие и колющие повреждения. Получение нового урона, голод или потеря сознания немедленно вырывают корни; ожоги не лечатся, а уязвимость к огню сохранена.'

- author: LuaM
  id: 2026080210
  time: '2026-08-02T06:18:01.3751785+00:00'
  changes:
  - type: Add
    message: 'Экспедиции перенесены к единому порталу центрального аванпоста Colossus: через него группа пешком отправляется в одно из сложных процедурных направлений и возвращается тем же порталом. Старые корабельные консоли больше не могут отправить целый шаттл в экспедицию.'
  - type: Add
    message: 'Рудные слои убраны из портальных экспедиций. В дальней комнате каждого данжа появляется ровно один тайник с неизучаемым обычным R&D технологическим диском и редким оружейным кейсом; опасные и экстремальные направления используют более высокий уровень награды.'

- author: LuaM
  id: 2026080211
  time: '2026-08-02T06:34:50.0379821+00:00'
  changes:
  - type: Fix
    message: 'Айболит теперь может полностью спасти раненого участника портальной экспедиции: он находит открытую связанную пару в нужный мир, проходит к пациенту, а при эвакуации подводит обездвиженного пациента к обратному порталу и согласованно переносит сначала пациента, затем себя, после чего продолжает доставку на медборт. Закрытые, несвязанные и ведущие на другую карту порталы не используются.'

- author: LuaM
  id: 2026080212
  time: '2026-08-02T06:57:40.3500314+00:00'
  changes:
  - type: Tweak
    message: 'В банкомате «Savings» переименован в понятный «Долгосрочный счёт» и получил пояснение: это общий баланс аккаунта для стартового снаряжения будущих персонажей, куда сохраняется избыток крупных депозитов; снять его как наличные нельзя. Экран снаряжения теперь отдельно показывает долгосрочные средства и баланс выбранного персонажа.'

- author: LuaM
  id: 2026080213
  time: '2026-08-02T07:08:10.5841024+00:00'
  changes:
  - type: Fix
    message: 'Ящик-хранилище теперь принимает только целое физически выгружаемое количество листов или единиц материала. Остаток меньше одного листа остаётся в подключённом сило, поэтому при разборке ящика ни одна помещённая в него единица ресурса не исчезает.'

- author: LuaM
  id: 2026080214
  time: '2026-08-02T10:23:38.9791725+00:00'
  changes:
  - type: Fix
    message: 'Диспетчер Айболита теперь координирует несколько спасателей: уже принятый пациент сохраняет своего владельца, свободный Айболит на его карте получает следующий вызов, а для сохранённой обязательной миссии создаётся отдельная замена, если остальные заняты или недееспособны. Один пациент не назначается двум Айболитам одновременно.'

- author: LuaM
  id: 2026080215
  time: '2026-08-02T10:40:00.0000000+00:00'
  changes:
  - type: Add
    message: 'В медицинском каталоге появилась диспетчерская консоль Айболита. Она в реальном времени показывает очередь спасательных вызовов, назначенного каждому Айболиту пациента, текущее действие, состояние оболочки и причину задержки или ошибки.'

- author: LuaM
  id: 2026080216
  time: '2026-08-02T10:48:07.1046567+00:00'
  changes:
  - type: Add
    message: 'Диспетчерская консоль Айболита получила управление заданиями для медиков: можно повторить аварийно завершённый вызов, назначить ожидающего пациента конкретному свободному Айболиту или отозвать его текущее задание. Сервер отклоняет команды для занятой либо повреждённой оболочки и не допускает второго владельца одного пациента.'

- author: LuaM
  id: 2026080217
  time: '2026-08-02T10:54:42.4269829+00:00'
  changes:
  - type: Add
    message: 'Диспетчерская консоль теперь показывает медицинские запасы каждого Айболита: общий остаток, количество средств, подходящих именно его текущему пациенту, состояние пополнения и подробную причину дефицита. Учёт читает руки, пояс, рюкзак, карманы и вложенные медицинские хранилища, не перемещая предметы.'

- author: LuaM
  id: 2026080218
  time: '2026-08-02T11:03:01.1178691+00:00'
  changes:
  - type: Add
    message: 'Диспетчерская консоль Айболита теперь контролирует жизнеобеспечение спасателей: показывает, подключён ли внутренний баллон, текущее давление и предупреждение о низком либо недоступном запасе газа. Работа внутренних баллонов проверена вместе с передвижением Айболита в вакууме и невесомости.'

- author: LuaM
  id: 2026080219
  time: '2026-08-02T11:12:38.0551037+00:00'
  changes:
  - type: Add
    message: 'Айболит и его автономное сопровождение получили скафандры и гермошлемы Эскадрона Смерти. Запасной кислородный баллон теперь находится в доступном кармане: при критическом давлении Айболит автоматически проверяет пригодность газа и штатно переключает внутреннее дыхание. Диспетчерская консоль показывает число резервных баллонов, давление лучшего резерва, количество автозамен и точную причину отказа, если пригодного запаса больше нет.'

- author: LuaM
  id: 2026080220
  time: '2026-08-02T15:00:00+03:00'
  changes:
  - type: Tweak
    message: 'Автономный ИИ-диспетчер теперь оценивает текущую обстановку сектора при каждом мировом импульсе и формирует более уместное сообщение либо выбирает одно безопасное секторное условие. При недоступности модели сохраняется прежний локальный резервный сценарий.'

- author: LuaM
  id: 2026080221
  time: '2026-08-02T15:20:00+03:00'
  changes:
  - type: Fix
    message: 'Универсальный синтезатор материи после сохранения и повторного вызова корабля больше не догоняет таймер прошлого раунда ускоренной выдачей руды. После загрузки производство продолжается с обычным интервалом.'
- author: LuaM
  id: 2026080222
  time: '2026-08-02T12:04:44.9826612+00:00'
  changes:
  - type: Fix
    message: Контрактные доказательства теперь закрывают только принятый конкретным персонажем заказ; чужая сдача больше не перехватывает награду.
  - type: Fix
    message: Награда за выполненный секторный контракт зачисляется на банковский счёт исполнителя до закрытия задания; при невозможности оплаты предмет и контракт остаются активными.
  - type: Add
    message: Каждый сюжетный секторный контракт теперь создаёт собственный физический предмет цели, отмечает его точным маршрутом и принимает у терминала только этот экземпляр от персонажа, который взял заказ.
  - type: Fix
    message: Секторный контракт больше нельзя случайно оплатить вдали от терминала или перепривязать к другому персонажу через тот же КПК; после отмены и завершения выданный навигатор удаляется.

- author: LuaM
  id: 2026080223
  time: '2026-08-02T14:10:06.0887248Z'
  changes:
  - type: Add
    message: 'Восстановлены оригинальные станции звёздных врат: «Барьерные врата» находятся в основном секторе Колосса, а «Аванпост экспедиций» и ННКСС «Тайпан» — в астероидном поясе.'
  - type: Add
    message: 'Врата набирают адрес через DHD с 40 символами; поддерживаются адресные бумаги и диски, редактор адресов, автодозвон и управляемый ирис Тайпана.'
  - type: Add
    message: 'В астероидном поясе также размещены оригинальный грузовой склад Тайпана и три восстановленные базы: «Блюспейс», «Колоссальный астероид» и «Линкор».'

- author: LuaM
  id: 2026080224
  time: '2026-08-02T17:15:53.7541439+03:00'
  changes:
  - type: Fix
    message: 'Айболит и все три бойца сопровождения выходят в скафандрах и гермошлемах Эскадрона Смерти. Сопровождение теперь самостоятельно подключает совместимый кислородный резерв и не меняет его на баллон с неподходящим газом.'
  - type: Fix
    message: 'Если пригодного кислорода больше нет, Айболит сохраняет текущую спасательную миссию, отходит с группой на медборт через подтверждённую взаимную пару порталов и после восстановления возвращается именно к прерванному пациенту. Повторный вызов не заменяет аварийный маршрут новым заданием.'

- author: LuaM
  id: 2026080225
  time: '2026-08-02T15:19:27.8077885Z'
  changes:
  - type: Tweak
    message: 'Интерфейс DHD восстановлен как круговое кольцо из 40 глифов; адрес местных врат можно скопировать в чат с правильным шрифтом символов.'
  - type: Tweak
    message: 'Активация звёздных врат теперь поэтапно фиксирует шевроны, проигрывает оригинальные звуки и анимации, включает свечение и заставляет ближайшие лампы мигнуть при открытии.'
  - type: Fix
    message: 'Червоточина работает только в направлении вызова и автоматически закрывается через 10 секунд после последнего прохода; потеря любых врат безопасно обрывает всю связь.'
  - type: Fix
    message: 'Обычные шлюзы больше не могут обойти DHD звёздных врат или закрытый ирис «Тайпана».'

- author: LuaM
  id: 2026080301
  time: '2026-08-04T13:40:00+03:00'
  changes:
  - type: Fix
    message: 'Обычные госты больше не могут использовать кнопку «Следовать» и список гост-ролей как удалённый локатор игроков, спящих персонажей, мобов и player-owned шаттлов. Админские инструменты наблюдения сохранены.'
  - type: Fix
    message: 'Попытки обычного госта проследовать к ограниченной цели через гост-роли теперь отклоняются сервером и записываются в лог, при этом обычные безопасные ghost-role цели остаются доступными.'

- author: LuaM
  id: 2026080401
  time: '2026-08-04T12:30:00+03:00'
  changes:
  - type: Fix
    message: 'После загрузки шаттла материальные хранилища, фабрикаторы, автолаты, протолаты и магниты больше не сохраняют старое временное состояние загрузки материалов и не зацикливают анимацию вставки.'
  - type: Fix
    message: 'Воздушные сигнализации на восстановленных шаттлах автоматически восстанавливают связь с вентиляциями и скрубберами в той же атмос-зоне, не цепляя устройства через стены и не требуя разбирать сигнализацию вручную.'
  - type: Fix
    message: 'Шаттл больше не должен отказываться сохраняться из-за парикмахерских ножниц: временные ссылки интерфейса MagicMirror очищаются перед сохранением корабля.'
  - type: Fix
    message: 'В банкомате длинное объяснение общего и долгосрочного баланса перенесено в описание объекта, чтобы в интерфейсе оставалась видна кнопка пополнения.'
  - type: Fix
    message: 'Немые персонажи больше не озвучиваются TTS при локальной речи, прямом обращении и разговоре по радио.'
  - type: Fix
    message: 'Повязки, бинты и другие глазные overlay-markings больше не должны рисоваться под глазами; цвет глаз в персонализации и админском модификаторе markings теперь берётся из настоящего цвета глаз персонажа.'

- author: LuaM
  id: 2026080402
  time: '2026-08-04T13:10:00+03:00'
  changes:
  - type: Fix
    message: 'Восстановлена локальная сборка Shared, Server, Client и IntegrationTests после несовместимых Goobstation namespace/API ссылок в исследованиях, зачарованиях, devil и xenobiology UI.'
  - type: Tweak
    message: 'Goobstation research и xenobiology окна снова имеют валидный XAML и совместимые пространства имён клиента; отсутствующие иконки исследований больше не ломают сборку клиента.'
  - type: Tweak
    message: 'Импортированные Goobstation зачарования приведены к текущим API проекта: slippery использует ParalyzeTime, stack расходуется через актуальный метод, а несовместимые fortune/fire/damage проверки безопасно адаптированы.'

- author: LuaM
  id: 2026080403
  time: '2026-08-04T20:13:00+03:00'
  changes:
  - type: Fix
    message: 'Автоматические голосования за пресет и карту больше не запускаются повторно за одно лобби и не задваиваются при входе игрока. Если включены оба голосования, сначала предлагается выбор пресета.'

- author: LuaM
  id: 2026081701
  time: '2026-08-17T17:27:00+03:00'
  changes:
  - type: Fix
    message: 'Диски координат пояса астероидов теперь продаются и в обычном станционном salvage-вендомате, а не только в POI-версии.'
  - type: Fix
    message: 'Локации пояса астероидов (станции и точки интереса) теперь создаются в каждом раунде независимо от активного игрового пресета.'
  - type: Fix
    message: 'После генерации станций пояс снова корректно требует диск координат для FTL-прыжка: регистрация станций больше не снимает этот замок.'
  - type: Fix
    message: 'Исправлено появление персонажей-фелинидов: восстановлены недостающие прототипы кистей.'
  - type: Fix
    message: 'В консоли исследований возвращены изменение размера окна и зум дерева технологий: кнопки «−», «+», «100%» и колесо мыши.'

- author: LuaM
  id: 2026081702
  time: '2026-08-17T18:01:00+03:00'
  changes:
  - type: Add
    message: 'На обломках утилизаторских экспедиций с шансом 15% можно найти диск адресов звёздных врат со случайным адресом одной из существующих врат. Найденные диски не пересекаются: два диска никогда не ведут на одни и те же врата.'
