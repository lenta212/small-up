Name: ServerNews
Order: -100
Entries:
- author: Команда сервера
  id: 2026071801
  time: '2026-07-18T12:00:00.0000000+00:00'
  changes:
  - type: Add
    message: Добавлены корабли TSF-SKR Aquila, LMC Quercus и новая версия PDV Scorpion с собственными картами и ваучерами.
  - type: Add
    message: Радары кораблей и управление огнём получили векторы ракет, раздельные фильтры IFF и доков, а также защиту от смешивания данных разных карт.
  - type: Add
    message: Торговые автоматы позволяют выбрать точное количество товара, увидеть полную стоимость и купить всю партию одной операцией.
  - type: Fix
    message: 'Переводы через банковское приложение КПК стали надёжнее: теперь видно получателя и сумму, а повторная оплата блокируется.'
  - type: Fix
    message: Покупка и продажа кораблей, банкоматы и грузовые заказы теперь дожидаются подтверждённого банковского расчёта до изменения мира.
  - type: Tweak
    message: Улучшена читаемость программ и настроек КПК; окно выбора рингтона снова можно нормально изменять по размеру.
  - type: Fix
    message: Окна консоли шаттла сохраняют безопасный минимальный размер и больше не сжимаются до непригодного состояния.
  - type: Tweak
    message: Ссылка на Discord вынесена в отдельную кнопку лаунчера вместо строки в описании сервера.

- author: Команда сервера
  id: 2026071802
  time: '2026-07-18T16:00:00.0000000+00:00'
  changes:
  - type: Add
    message: Добавлен генератор кораблей с экспедиционными, боевыми и утилизационными вариантами.
  - type: Add
    message: В секторе появились ограниченные гражданские, грузовые, аварийные и неизвестные радарные контакты с маршрутными контрактами.
  - type: Add
    message: Развиты автономные спасательные команды, навигация, медицинская помощь и управление активностями NPC без бесконтрольного роста населения.
  - type: Add
    message: Добавлены дополнительные проверки подозрительных действий с уведомлениями администрации.
  - type: Fix
    message: Размножение животных, миграции вредителей и временные спавнеры теперь соблюдают общий лимит населения карты.
  - type: Add
    message: Подготовлена основа для продолжительных кампаний с сохранением важных данных между раундами.

- author: Команда сервера
  id: 2026071902
  time: '2026-07-19T06:30:00.0000000+00:00'
  changes:
  - type: Tweak
    message: Обучение больше не открывается в лобби и предлагается только после появления живого персонажа внутри станции.
  - type: Fix
    message: Исправлены повторный вход в крио, пробуждение, выход из капсулы и восстановление персонажа с инвентарём между раундами.
  - type: Fix
    message: Временные действия сна и крио больше не оставляют клиенту удалённые сущности и не вызывают зависание при укладывании в капсулу.
  - type: Tweak
    message: Универсальный и экспедиционный синтезаторы материи теперь можно откручивать и закреплять гаечным ключом.
  - type: Add
    message: В руководстве появилась технологическая карта производства с источниками материалов, станками, ценами, конвейерами, шлюзами и киберорганами.

- author: Команда сервера
  id: 2026071903
  time: '2026-07-19T07:50:00.0000000+00:00'
  changes:
  - type: Add
    message: Добавлены корабли TSF Arrow и Rising, исправленный экспедиционный Phoenix, новые ваучеры и улучшенное управление вооружением.
  - type: Add
    message: Добавлены кибернетические глаза, сердце, печень и лёгкие, их улучшенные варианты, исследования, рецепты и поддержка медицинских техфабов.
  - type: Add
    message: Добавлены блюспейс-хирургические перчатки для операций через одежду и продвинутый костный мультитул.
  - type: Add
    message: Свободные человеческие и дионьи мозги теперь видны на радаре, но скрываются внутри тела или другого контейнера.
  - type: Add
    message: IPC теперь могут безопасно ремонтировать себя нанитным аппликатором; ремонт прекращается после полного восстановления.
  - type: Tweak
    message: Vector 9 мм, Vector .45 ACP и NTSF-HCLM стали полноценным одноручным оружием; разброс Sultan приведён к корректному значению.
  - type: Fix
    message: Стены корректно удаляются вместе с уничтоженной сеткой, а Brain Blip больше не конфликтует с удалением персонажа через глубокое крио.
  - type: Tweak
    message: Обновлены спрайты скафандров Nordfall и винтовки Annie, локализации языкового меню и наборы имён Синдиката.

- author: Команда сервера
  id: 2026071904
  time: '2026-07-19T08:05:00.0000000+00:00'
  changes:
  - type: Add
    message: В меню «Обновления» появился отдельный раздел «Новости сервера».
  - type: Tweak
    message: Уведомление о новых обновлениях теперь показывает новости нашего сервера.
  - type: Tweak
    message: Следующие обновления сервера будут добавляться в этот раздел.

- author: Команда сервера
  id: 2026071905
  time: '2026-07-19T08:47:45.5518124+00:00'
  changes:
  - type: Add
    message: В верфях появились адаптированные корабли HOM «Горняк» за 69 000 и медицинский USS «Саламандра» за 105 000.
  - type: Tweak
    message: «Горняк» получил шахтёрское оснащение, а «Саламандра» — медицинскую комплектацию и более стабильную работу двигателя.
  - type: Tweak
    message: В рецепте сборки медибота локализованы названия всех деталей и сохранена безопасная доза трикордразина.

- author: Команда сервера
  id: 2026071906
  time: '2026-07-19T09:20:20.3045135+00:00'
  changes:
  - type: Fix
    message: Производственные станки теперь принимают новые задания во время работы и могут держать в очереди рецепты, для которых сырьё будет загружено позже; материалы списываются только перед фактическим запуском изделия.
  - type: Tweak
    message: Очередь производства стала стабильнее при больших партиях; задания разных заказчиков больше не сливаются в одну запись.
  - type: Add
    message: Контрактор, пилот и наёмник теперь сразу получают медицинский имплант, который передаёт медикам название корабля и координаты при критическом состоянии или смерти, в том числе после клонирования.
  - type: Tweak
    message: Лишний медицинский имплантер убран из гражданских наборов; шуточные имплантеры сохранены, а трекеры и радиоимплантер Авангарда остались без изменений.

- author: Команда сервера
  id: 2026071907
  time: '2026-07-19T09:35:14.8376853+00:00'
  changes:
  - type: Tweak
    message: Полные топливные стаки плазмы, урана и бананиума увеличены с 25 до 75 единиц; цены пересчитаны до 4500, 9375 и 18750 кредитов без изменения стоимости одной единицы топлива.
  - type: Fix
    message: Вульпканины снова используют собственные звуки смеха, чихания и плача, а мужские и женские персонажи получили раздельные крики, рычание и вой.
  - type: Fix
    message: TTS возвращён игровым роботам — боргам, MMI, позитронным мозгам и pAI назначен роботизированный голос, а станционному ИИ — отдельный голос; выбранные игроками голоса КПБ не переопределяются.

- author: Команда сервера
  id: 2026071908
  time: '2026-07-19T10:23:23.0000000+00:00'
  changes:
  - type: Fix
    message: Исправлено глубокое крио для IPC — установленный позитронный мозг больше не определяется как отдельное органическое тело, поэтому синтетические персонажи корректно сохраняются и могут проснуться.
  - type: Fix
    message: После отклонённой попытки сохранения криокапсула возвращает персонажу возможность повторно запустить вход; настоящий пассажир или живое существо в инвентаре по-прежнему блокирует крио.

- author: Команда сервера
  id: 2026072001
  time: '2026-07-19T23:00:21.1899840+00:00'
  changes:
  - type: Add
    message: Купленные корабли теперь сохраняются между раундами и возвращаются владельцу после входа.
  - type: Fix
    message: Система не позволяет одновременно получить две копии одного корабля, а проданный корабль больше не возвращается владельцу.

- author: Команда сервера
  id: 2026072002
  time: '2026-07-19T23:13:29.6673181+00:00'
  changes:
  - type: Add
    message: В консоли верфи можно выбрать конкретные свободные ворота для покупки или вызова сохранённого корабля.
  - type: Add
    message: Пристыкованный к текущей станции корабль без экипажа можно сохранить через консоль верфи и позднее вызвать обратно.
  - type: Fix
    message: Перед появлением корабля повторно проверяется, что выбранные ворота свободны и кораблю хватает места.

- author: Команда сервера
  id: 2026072003
  time: '2026-07-19T23:27:37.1385304+00:00'
  changes:
  - type: Tweak
    message: При сохранении экипаж автоматически высаживается у консоли верфи, а сохранённый корабль исчезает из мира; документ на ID-карте остаётся и не позволяет купить на неё второй корабль.
  - type: Fix
    message: Полное сохранение корабля больше не прерывается из-за содержимого торговых автоматов.

- author: Команда сервера
  id: 2026072004
  time: '2026-07-19T23:41:46.5274175+00:00'
  changes:
  - type: Fix
    message: В окне знакомства со станцией больше не отображаются служебные слова и скобки цветовой разметки.
  - type: Fix
    message: Сохранение активного корабля больше не отклоняется из-за связанных со станцией данных.
  - type: Fix
    message: Если создание корабля не удалось, платёж возвращается, а повторная покупка не блокируется сообщением о проверке администратором.
  - type: Fix
    message: Сохранение корабля больше не включает владельца, если он находится на станции.

- author: Команда сервера
  id: 2026072005
  time: '2026-07-20T00:07:59.7423459+00:00'
  changes:
  - type: Fix
    message: Сохранение пристыкованного корабля больше не отклоняется из-за соединения со станцией.

- author: Команда сервера
  id: 2026072006
  time: '2026-07-20T00:18:08.1987230+00:00'
  changes:
  - type: Fix
    message: Успешная покупка корабля больше не откатывается сообщением о проверке результата администратором.

- author: Команда сервера
  id: 2026072007
  time: '2026-07-20T00:31:08.1749869+00:00'
  changes:
  - type: Fix
    message: Вызов сохранённого корабля больше не срывается из-за ложной занятости выбранных ворот.

- author: Команда сервера
  id: 2026072008
  time: '2026-07-20T07:03:19.8372434+00:00'
  changes:
  - type: Fix
    message: Криокапсула снова показывает действие «Залезть» даже если персонаж уже лёг спать рядом с ней.
  - type: Tweak
    message: По пустой криокапсуле теперь можно войти обычным взаимодействием без перетягивания персонажа.

- author: Команда сервера
  id: 2026072009
  time: '2026-07-20T07:17:49.1566656+00:00'
  changes:
  - type: Fix
    message: Консоль верфи снова позволяет владельцу вызвать припаркованный корабль после криосна или нового раунда, даже если новая ID-карта ещё без документа на корабль.

- author: LuaM
  id: 2026072010
  time: '2026-07-20T12:00:43.1915488+00:00'
  changes:
  - type: Fix
    message: Заказ экспедиционных шаттлов, включая Phoenix, больше не отменяется при сохранении; купленные корабли продолжают сохраняться между раундами и персонажами владельца.
  - type: Fix
    message: Выбранные ворота верфи больше не сбрасываются при обновлении интерфейса, а при первом открытии выбираются свободные ворота.
  - type: Fix
    message: Документ припаркованного корабля теперь можно отвязать от ID-карты без ошибочного сообщения о продаже.
  - type: Fix
    message: Стыковка и отстыковка теперь жёстко привязаны к выбранной паре портов, а команда «Отстыковать всё» действует только на управляемый шаттл.
  - type: Tweak
    message: Список портов во вкладке стыковки очищен от дублирующих статусов синхронизации БСС.

- author: LuaM
  id: 2026072011
  time: '2026-07-20T15:05:34.0296211+00:00'
  changes:
  - type: Fix
    message: Сохранение шаттлов с очередью переработчика руды больше не срывается; рецепт и прогресс производства возвращаются вместе с кораблём.

- author: LuaM
  id: 2026072012
  time: '2026-07-20T20:37:19.3005164+00:00'
  changes:
  - type: Tweak
    message: Корабли, полученные по ваучерам, теперь считаются временными — ваучер только создаёт корабль и не привязывает его к межраундовому хранилищу; парковка и вызов сохранённых кораблей работают через ID-карту.
  - type: Tweak
    message: 'При вызове сохранённого корабля открывается карта станции: свободные ворота выбираются прямо на схеме, а занятые отмечаются отдельно.'

- author: LuaM
  id: 2026072013
  time: '2026-07-20T20:46:50.9062051+00:00'
  changes:
  - type: Tweak
    message: Блюспейс-события с грузовыми, McCargo и синдикатовскими ящиками теперь могут повторяться не чаще одного раза за 24 часа.

- author: LuaM
  id: 2026072014
  time: '2026-07-20T21:16:39.0395091+00:00'
  changes:
  - type: Add
    message: Флагман ТСФ «Гальцион» теперь автоматически открывает огонь по кораблям Авангарда, отмеченным принадлежностью PDV.
  - type: Tweak
    message: На радаре «Гальцион» и крепость «Гелиос» подписываются принадлежностью TSF и PDV.

- author: LuaM
  id: 2026072015
  time: '2026-07-20T21:16:39.0395091+00:00'
  changes:
  - type: Tweak
    message: Блюспейс-планетоиды теперь прибывают парами раз в 20 минут, остаются в секторе 15 минут и дают перед следующей парой 5 минут перерыва.
  - type: Tweak
    message: При уходе планетоидов игроки и переносимые ими вещи остаются, а сами планетоиды и оставленные на них предметы исчезают.

- author: LuaM
  id: 2026072101
  time: '2026-07-20T21:46:09.0452465+00:00'
  changes:
  - type: Tweak
    message: Кабели и все рецепты категории «Компоненты» теперь требуют медь; более высокий уровень детали расходует больше материала.
  - type: Add
    message: Технологическая карта производства дополнена цепочкой «малахит → медь» и пересчитанными ценами конструкций.

- author: LuaM
  id: 2026072102
  time: '2026-07-20T22:05:19.3944224+00:00'
  changes:
  - type: Add
    message: 'На станциях появился диск координат «Пояс астероидов». Все такие диски ведут в одно общее пространство «ПОЯС АСТЕРОИДОВ: КРИТИЧЕСКАЯ ОПАСНОСТЬ», доступное во вкладке World консоли шаттла.'
  - type: Tweak
    message: Критически опасный пояс заполнен значительно более плотными скоплениями астероидов, чем обычное пространство Фронтира.

- author: LuaM
  id: 2026072103
  time: '2026-07-20T22:26:24.9872176+00:00'
  changes:
  - type: Tweak
    message: Консоль управления шаттлом получила новый футуристичный интерфейс с наглядными иконками режимов, целостными панелями навигации, мира и стыковки.
  - type: Tweak
    message: При открытии консоль включается с эффектом старого кинескопа, развёрткой и строками сканирования.
  - type: Fix
    message: Окно консоли шаттла теперь свободно меняет размер, а радар и прокручиваемые боковые панели остаются доступными даже при размере 640 на 480.

- author: LuaM
  id: 2026072104
  time: '2026-07-21T00:09:53.3008629+00:00'
  changes:
  - type: Tweak
    message: Реестр межраундового владения кораблями очищен; персонажи, банковские счета, прогресс и криосохранения не затронуты.
  - type: Fix
    message: Рабочая область консоли управления шаттлом теперь заполняет растянутое окно, а радар использует всё доступное место вместо узкой панели в левом верхнем углу.

- author: LuaM
  id: 2026072105
  time: '2026-07-21T00:24:47.4590149+00:00'
  changes:
  - type: Fix
    message: Луч сканирования и боевые трассеры во вкладке «Полёт» теперь обрезаются по границам сетки радара и не заходят на боковую панель управления.

- author: LuaM
  id: 2026072106
  time: '2026-07-21T09:13:22.2042775+00:00'
  changes:
  - type: Add
    message: Спасатели, инженеры и медики-боты, шахтёрские и сервисные дроны, логистические корабли, служебные боты, турели, враждебные NPC и животные получили общий ситуационный алгоритм выбора между задачей, помощью, боем и отступлением.
  - type: Tweak
    message: Опасность, нехватка энергии или боезапаса и потеря маршрута теперь прерывают обычную работу ботов; после устранения причины они возвращаются к своей роли.
  - type: Tweak
    message: Инженеры и медики-боты применяют реально удерживаемые инструменты и медикаменты, завершают заказ только после устранения повреждений и освобождают его для другого исполнителя при нехватке снаряжения или потере маршрута.
  - type: Tweak
    message: Такси, грузовые и развлекательные боты теперь принимают только подходящие их роли маршруты и подтверждают такие задания после прибытия к указанной точке.
  - type: Fix
    message: Ситуационный ИИ больше не меняет план сущности, пока ею напрямую управляет игрок.

- author: LuaM
  id: 2026072107
